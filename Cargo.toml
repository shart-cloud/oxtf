[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
tf_limits = { path = "crates/tf_limits" }
tf_span = { path = "crates/tf_span" }
tf_allocator = { path = "crates/tf_allocator" }
tf_ast = { path = "crates/tf_ast" }
tf_parser = { path = "crates/tf_parser" }
tf_schema = { path = "crates/tf_schema" }
tf_eval = { path = "crates/tf_eval" }
tf_semantic = { path = "crates/tf_semantic" }
tf_linter = { path = "crates/tf_linter" }
tf_rule_ir = { path = "crates/tf_rule_ir" }
tf_plan = { path = "crates/tf_plan" }
tf_scan = { path = "crates/tf_scan" }
tf_fetch = { path = "crates/tf_fetch" }
tf_rego = { path = "crates/tf_rego" }
tf_yaml = { path = "crates/tf_yaml" }
bumpalo = { version = "3.20.3", features = ["collections", "boxed"] }
insta = "1.49.0"
miette = "7.6.0"
rayon = "1.12.0"
self_cell = "1.3.0"
phf = "0.14.0"
postcard = "1.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hcl-edit = "0.9.7"
phf_codegen = "0.14.0"
toml = "1.1.8"
tf_schema_codegen = { path = "crates/tf_schema_codegen" }

[profile.release]
debug = 1

# regorus 0.13.0 plus four OPA-conformance fixes (jlgore/regorus, branch
# oxtf; see FIRST_CLASS_RULES_PLAN.md F3). Drop once upstream releases them.
[patch.crates-io]
regorus = { git = "https://github.com/jlgore/regorus", rev = "b395fb851e73d94a61d395ee3258ffbe1710961c" }

[workspace.lints.clippy]
# Threshold in clippy.toml. Existing long functions carry
# #[expect(clippy::too_many_lines)]; an expectation that no longer fires fails
# the build, so the allowlist only shrinks.
too_many_lines = "warn"

# Release artifacts: the release profile without debug info, stripped.
[profile.dist]
inherits = "release"
debug = false
strip = true
