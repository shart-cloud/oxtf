[CKV_AWS_88]
level = "medium"
profile = "security"
category = "network"
why = "A public IP creates a possible internet path; security groups and routes determine whether inbound connections are allowed. The address alone is not a public service or data leak."
remediation = "Remove associate_public_ip_address where direct public access is unnecessary. Provide required egress and administrative access privately, and review security groups and routes for intentionally public instances."
guideline = "https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"

[CKV_AWS_61]
