[CKV_AWS_355]
level = "medium"
profile = "security"
category = "iam"
why = "Resource = * broadens a restrictable action to all matching resources. Impact depends on the action; a read-only scope issue is not equivalent to administrative access."
remediation = "Scope restrictable actions to required resource ARNs. Put actions without resource-level permission support in separate statements retaining Resource = *, and constrain them with applicable conditions. Validate against the service authorization reference."
guideline = "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_resource.html"

[CKV2_AZURE_31]
level = "medium"
profile = "security"
category = "network"
why = "A missing subnet NSG removes one network-filtering boundary. NIC NSGs, routing, and other controls can still restrict traffic; this check does not prove public reachability."
remediation = "Associate an appropriate NSG with the subnet using azurerm_subnet_network_security_group_association. Review NIC rules and required service traffic first; do not attach a permissive NSG just to satisfy the check."
guideline = "https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview"

[CKV_GCP_20]
level = "medium"
profile = "security"
category = "network"
why = "Missing authorized-network restrictions weakens IP endpoint filtering. Actual reachability depends on the configured endpoint type and network isolation, and API authentication is still required."
remediation = "Review the cluster control-plane endpoint configuration. For an enabled IP endpoint, configure master_authorized_networks_config with required client CIDRs or use a supported private or DNS endpoint design. Test administrative connectivity before tightening access."
guideline = "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/network-isolation"

