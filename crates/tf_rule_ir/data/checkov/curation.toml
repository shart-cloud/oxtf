remediation = "Enable Workload Identity Federation and the GKE metadata server for supported node pools. Grant each workload only its required permissions and test identity migration before updating existing workloads."
guideline = "https://docs.cloud.google.com/kubernetes-engine/docs/concepts/workload-identity"

