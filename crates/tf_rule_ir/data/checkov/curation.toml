[CKV_GCP_32]
level = "medium"
profile = "security"
category = "iam"
why = "Accepting project metadata SSH keys can broaden login access to reachable VMs. The check does not establish whether OS Login already governs access, whether project keys exist, or whether SSH is reachable."
remediation = "For metadata-based SSH, set metadata.block-project-ssh-keys = true and retain tested instance-specific or emergency access before rollout. If OS Login is enabled, verify effective IAM login permissions instead: metadata SSH keys are not used. Review inherited instance-template settings and firewall access."
guideline = "https://docs.cloud.google.com/compute/docs/connect/restrict-ssh-keys"

[CKV_AWS_27]
level = "medium"
profile = "security"
category = "encryption"
why = "Explicitly disabling queue encryption leaves message bodies without at-rest protection. Missing attributes alone do not prove this: new SQS queues have service-side encryption defaults."
remediation = "Set sqs_managed_sse_enabled = true, or configure kms_master_key_id when KMS is required. Check the effective queue settings and provider version before interpreting omitted attributes. Verify publisher and consumer permissions when changing keys."
guideline = "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-sse-existing-queue.html"
description = "SQS encryption is disabled or not explicit in this configuration"

[CKV_GCP_68]
level = "low"
profile = "security"
why = "Secure Boot verifies boot components and reduces bootkit persistence. It is disabled by default on GKE Standard node pools for compatibility; omission is a hardening gap, not evidence of compromise."
remediation = "Use a supported Shielded GKE node image and enable node_config.shielded_instance_config.enable_secure_boot after testing drivers and kernel modules. Plan node updates within maintenance and disruption budgets. Verify effective settings for Autopilot or inherited node configuration before changing it."
guideline = "https://docs.cloud.google.com/kubernetes-engine/docs/how-to/shielded-gke-nodes"

[CKV_GCP_38]
level = "low"
profile = "hygiene"
category = "encryption"
why = "Google Cloud encrypts stored data by default. Customer-supplied disk keys add a key-custody requirement rather than baseline encryption."
remediation = "Configure customer-supplied disk encryption only when required by your key-management policy. Plan key retention, recovery, and any required disk migration; loss of the key can make data inaccessible."
guideline = "https://docs.cloud.google.com/docs/security/encryption/default-encryption"

[CKV_GCP_39]
level = "low"
profile = "security"
why = "The check detects an absent Shielded VM configuration or explicitly disabled vTPM/integrity monitoring; it does not check Secure Boot. Supported Shielded VM images enable vTPM and integrity monitoring by default, so omission alone does not establish they are off."
remediation = "Verify the boot image supports Shielded VM and inspect effective vTPM and integrity-monitoring settings. Set shielded_instance_config.enable_vtpm and enable_integrity_monitoring to true when needed. Schedule required stop/start or instance-template rollout; consider boot and BitLocker recovery implications. Review Secure Boot separately."
guideline = "https://docs.cloud.google.com/compute/shielded-vm/docs/modifying-shielded-vm"
description = "Compute Shielded VM vTPM and integrity monitoring are disabled or not explicit"

