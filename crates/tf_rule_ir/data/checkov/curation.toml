[CKV_AWS_63]
level = "high"
profile = "security"
category = "iam"
why = "Wildcard actions allow a broad set of operations on the permitted resources. This check does not establish account-wide administration or evaluate every effective-permission restriction."
remediation = "Replace unrestricted Action wildcards with required actions and scope Resource to supported ARNs. Separate actions requiring Resource = * and apply supported conditions. Validate the policy and test the workload."
guideline = "https://docs.aws.amazon.com/config/latest/developerguide/iam-policy-no-statements-with-full-access.html"

[CKV_AWS_286]
level = "high"
profile = "security"
category = "iam"
why = "The policy contains actions or combinations associated with privilege escalation. Exploitability depends on accessible roles, services, conditions, and other effective-permission controls."
remediation = "Remove unnecessary escalation-related actions. Restrict iam:PassRole to required role ARNs and services, and review permissions to create workloads or change policies. Validate the complete principal permissions and test the intended workflow."
guideline = "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html"

[CKV_AWS_287]
level = "high"
profile = "security"
category = "iam"
why = "The policy permits actions that can expose credentials. Resource scope, conditions, and effective permissions determine which credentials can actually be obtained."
remediation = "Remove credential-reading or credential-creation actions the workload does not need. Scope remaining permissions to required resources and trusted principals. Review affected credential access and rotate credentials if unauthorized disclosure is confirmed."
guideline = "https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html"

[CKV_AWS_288]
level = "high"
profile = "security"
category = "iam"
why = "The policy includes actions that can read or export data. This is a permission-risk finding, not proof that data was exfiltrated; resources, conditions, and other controls determine impact."
remediation = "Restrict data-read and export actions to required resources and destinations. Review relevant service, network, and organization conditions, then validate the policy and test legitimate data access."
guideline = "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html"

[CKV_AWS_70]
level = "high"
profile = "security"
category = "storage"
why = "A broad principal in a bucket policy can grant public access. Allowed actions, conditions, and effective public-access controls determine what is accessible; a wildcard is not automatically full bucket compromise."
remediation = "Limit Allow principals, actions, and resources to the required access. Validate service and organization conditions and review IAM Access Analyzer results. Do not remove wildcard principals from Deny statements that enforce protections."
guideline = "https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html"

