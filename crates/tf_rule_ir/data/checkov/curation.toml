profile = "security"
category = "storage"
why = "Separate ACL and IAM authorization increases access-control complexity. Disabled uniform access does not itself make a bucket public."
remediation = "Audit object ACLs, migrate required access to IAM, then set uniform_bucket_level_access = true. It becomes irreversible after 90 consecutive days. Review public IAM bindings and public access prevention separately."
guideline = "https://docs.cloud.google.com/storage/docs/uniform-bucket-level-access"


[CKV_AZURE_59]
level = "medium"
profile = "security"
category = "network"
why = "A public storage endpoint can accept network connections; it does not imply anonymous blob access. Firewall rules, identity permissions, and container access still matter."
remediation = "Disable public_network_access_enabled when private connectivity is required, and configure private endpoints and DNS first. Otherwise restrict public network rules to required sources and review anonymous blob access separately."
guideline = "https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security"
description = "Azure Storage public network endpoint is enabled or not explicitly disabled"
