# Curated metadata for the bundled Checkov catalog.
#
# Hand-maintained. Regenerating rules.json never touches this file;
# build.rs applies it to the bundled rules and fails the build on an ID
# that is not in rules.json or a value it does not know.
#
# Checkov's open-source checks carry no severity, so every bundled rule is
# `medium` until it is listed here.
#
# profile   security  a misconfiguration that exposes, weakens or
#                     over-grants (runs by default)
#           audit     visibility, not exposure: logging, flow logs,
#                     retention (--profile audit or all)
#           hygiene   operations, cost, tags, style, reliability
#                     (--profile hygiene or all)
#           Rules not listed are `unreviewed` and run by default.
# level     critical  direct public exposure or full administrative access
#           high      a likely exposure or a credential path
#           medium    defence in depth
#           low       hardening, or a finding that rarely matters alone
# category  network | storage | iam | encryption | other (optional: keeps
#           the translated category when absent)
# why       one line: the reason for the call, for review
#
# Order: the most frequent rules on the 17-repository corpus first
# (docs/plans/SIGNAL_PLAN.md, workstream D), then well-known critical
# checks the corpus of library modules rarely exercises, then every other
# rule a default corpus scan reported, grouped by service.
#
# Principles, so calls stay consistent:
# - exposure or an over-grant is `security`, levelled by blast radius;
# - logging, flow logs and log retention are `audit`;
# - backups, availability, deletion protection, cost, capacity and
#   operational style are `hygiene`;
# - a customer-managed key where the provider already encrypts the data
#   is a compliance choice: `low`, `hygiene`. Data not encrypted at all
#   is `security`.

