# Curated metadata for the bundled Checkov catalog.
#
# Hand-maintained. Regenerating rules.json never touches this file;
# build.rs applies it to the bundled rules and fails the build on an ID
# that is not in rules.json or a value it does not know.
#
# Checkov's open-source checks carry no severity, so every bundled rule is
# `medium` until it is listed here.
#
# profile   security  a misconfiguration that exposes, weakens or
#                     over-grants (runs by default)
#           audit     visibility, not exposure: logging, flow logs,
#                     retention (--profile audit or all)
#           hygiene   operations, cost, tags, style, reliability
#                     (--profile hygiene or all)
#           Rules not listed are `unreviewed` and run by default.
# level     critical  broad administrative grants with account-wide potential impact
#           high      broad data access, dangerous permissions, or administrative ingress
#           medium    missing guardrails, public endpoints, scoped over-grants, encryption gaps
#           low       hardening, or a finding that rarely matters alone
# category  network | storage | iam | encryption | other (optional: keeps
#           the translated category when absent)
# why       severity rationale, exported to consumers as `rationale`
# remediation  actionable steps and material migration or compatibility limits
# guideline    official HTTPS documentation supporting the guidance
# description  optional corrected title and finding message; predicates stay unchanged
# remediation and guideline must be supplied together. Legacy entries without
# them remain visibly incomplete in the signal metrics. Review pass: 2026-10-20.
#
# Order: the most frequent rules on the 17-repository corpus first
# (docs/plans/SIGNAL_PLAN.md, workstream D), then well-known critical
# checks the corpus of library modules rarely exercises, then every other
# rule a default corpus scan reported, grouped by service.
#
# Principles, so calls stay consistent:
# - exposure or an over-grant is `security`, levelled by blast radius;
# - logging, flow logs and log retention are `audit`;
# - backups, availability, deletion protection, cost, capacity and
#   operational style are `hygiene`;
# - a customer-managed key where the provider already encrypts the data
#   is a compliance choice: `low`, `hygiene`. Data not encrypted at all
#   is `security`.
# - a public endpoint or absent guardrail is not proof of anonymous data access;
# - a wildcard permission is evaluated in its action, resource and condition context;
# - severity labels describe potential impact, not certainty or proven exploitability.

# -- most frequent on the corpus ----------------------------------------

[CKV2_GCP_18]
level = "low"
profile = "hygiene"
category = "network"
why = "No associated firewall rule was found in this configuration. GCP has implied deny-ingress and allow-egress rules; missing an explicit rule does not establish open ingress, and inherited policies may apply."
remediation = "Review effective VPC and hierarchical firewall policies. Declare narrowly scoped rules only for required traffic and restrictive egress where needed. Do not add an allow rule merely to satisfy this presence check."
guideline = "https://docs.cloud.google.com/firewall/docs/firewalls"
description = "GCP network has no explicit associated firewall rule in the scanned configuration"

