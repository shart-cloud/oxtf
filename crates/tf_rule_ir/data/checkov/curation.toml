[CKV_GCP_66]
level = "medium"
profile = "security"
why = "The check detects whether Binary Authorization enforcement is configured, not whether the admission policy rejects untrusted images. The default project policy allows all images."
remediation = "Enable binary_authorization with evaluation_mode = PROJECT_SINGLETON_POLICY_ENFORCE and configure the project admission policy with required attestations or an approved image policy. Test in dry-run mode and review exemptions before enforcement; enabling the cluster switch alone does not restrict images."
guideline = "https://docs.cloud.google.com/binary-authorization/docs/configure-policy-gke"

