why = "S3 automatically encrypts new object uploads with SSE-S3. A missing or nonmatching explicit encryption declaration does not prove new objects are unencrypted; older objects need separate inventory."
remediation = "Use an explicit bucket encryption configuration when your policy requires a chosen algorithm or key. Review legacy objects separately and migrate unencrypted ones using encrypted copies. A customer-managed KMS key is an additional key-control requirement."
guideline = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/default-encryption-faq.html"
description = "S3 explicit encryption configuration does not match the supported policy choices"


