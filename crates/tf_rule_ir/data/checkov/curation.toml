why = "This role-name list flags project grants associated with service-account management or impersonation, including service-agent roles. It does not inspect the principal, conditions or an exploitable permission chain; legitimate service-agent bindings can match."
remediation = "Review the role and recipient before editing. Keep required service-agent roles on their designated Google-managed agents, never on unrelated principals. For user or workload access, replace broad grants with least-privilege roles and service-account-level bindings where supported. Test dependent services before removing permissions."
guideline = "https://docs.cloud.google.com/iam/docs/roles-permissions/iam"
description = "Project IAM role warrants review for service-account management or impersonation"

