# -- well-known critical checks ------------------------------------------

[CKV_AWS_20]
level = "high"
profile = "security"
category = "storage"
why = "A public-read ACL grants broad read permissions if ACLs are enabled and effective public-access controls allow it. Data sensitivity and actual access are not established by this check."
remediation = "Remove public-read and public-read-write ACLs. Prefer bucket-owner-enforced ownership and Block Public Access for private buckets; verify existing policies, account controls, and intentional public-content requirements."
guideline = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html"

[CKV_AWS_57]
level = "high"
profile = "security"
category = "storage"
why = "A public-write ACL can allow untrusted uploads or modifications when effective. ACL ownership settings and public-access controls may block the grant; the finding does not prove successful writes."
remediation = "Remove public-read-write ACLs and grant upload rights only to intended identities. Review bucket ownership and Block Public Access, then verify anonymous writes are denied without disrupting authorized uploads."
guideline = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html"

[CKV_AWS_24]
level = "high"
profile = "security"
category = "network"
why = "Internet-wide ingress to 22 broadens the attack surface of attached resources. A security-group rule alone does not establish a public IP, route, or exploitable service."
remediation = "Remove internet-wide IPv4 and IPv6 ingress for 22; allow only required ports from trusted CIDRs or security groups. Review attached resources and test a private administrative access path before applying."
guideline = "https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"

[CKV_AWS_25]
level = "high"
profile = "security"
category = "network"
why = "Internet-wide ingress to 3389 broadens the attack surface of attached resources. A security-group rule alone does not establish a public IP, route, or exploitable service."
remediation = "Remove internet-wide IPv4 and IPv6 ingress for 3389; allow only required ports from trusted CIDRs or security groups. Review attached resources and test a private administrative access path before applying."
guideline = "https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"

[CKV_AWS_277]
level = "high"
profile = "security"
category = "network"
why = "Internet-wide ingress to all ports and protocols broadens the attack surface of attached resources. A security-group rule alone does not establish a public IP, route, or exploitable service."
remediation = "Remove internet-wide IPv4 and IPv6 ingress for all ports and protocols; allow only required ports from trusted CIDRs or security groups. Review attached resources and test a private administrative access path before applying."
guideline = "https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html"

[CKV_AWS_17]
level = "high"
profile = "security"
category = "network"
why = "A public database endpoint increases exposure, but security groups and routing still govern reachability and database authentication still applies. This is not proof of public data access."
remediation = "Set publicly_accessible = false and provide private application connectivity. Restrict database security-group ingress to required clients. Plan the connectivity change and verify applications can reconnect before rollout."
guideline = "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/infrastructure-security.html"
description = "RDS instance enables a public endpoint"

