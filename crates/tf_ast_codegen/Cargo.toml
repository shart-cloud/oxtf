[package]
name = "tf_ast_codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generates Visit / VisitMut / AstKind / GetSpan for tf_ast from crates/tf_ast/src/ast.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tf_ast_codegen"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
