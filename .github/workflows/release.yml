name: Release
# A `vX.Y.Z` tag builds the CLI and the tfscan wheel for each platform and opens
# a draft GitHub release with checksums; a person reviews and publishes it.
on:
  push:
    tags: ["v*"]
  # Packaging changes build every artifact; only a tag drafts a release.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - crates/tfscan_py/pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.96.0
  # Linux builds link against glibc 2.17 (RHEL 7 and later) through zig. Newer
  # zig releases cannot link Rust rlibs; keep 0.13 with cargo-zigbuild.
  ZIG_VERSION: 0.13.0
  CARGO_ZIGBUILD_VERSION: 0.24.0
  MATURIN_VERSION: 1.15.0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: version
        name: The tag must match the workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, zig: "2.17", smoke: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04, zig: "2.17", smoke: false }
          - { target: aarch64-apple-darwin, runner: macos-14, smoke: true }
          - { target: x86_64-apple-darwin, runner: macos-14, smoke: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
      - run: rustup default "$RUST_TOOLCHAIN"
      - run: pip install "maturin==$MATURIN_VERSION"
      - name: Linux toolchain (zig and cargo-zigbuild)
        if: matrix.zig
        run: |
          pip install "ziglang==$ZIG_VERSION"
          cargo install --locked "cargo-zigbuild@$CARGO_ZIGBUILD_VERSION"
      - name: Build the CLI (Linux)
        if: matrix.zig
        run: cargo zigbuild --profile dist --locked -p tf_cli --target "$TARGET.${{ matrix.zig }}"
      - name: Build the CLI (macOS)
        if: ${{ !matrix.zig }}
        run: cargo build --profile dist --locked -p tf_cli --target "$TARGET"
      - name: Build the wheel (Linux, manylinux2014)
        if: matrix.zig
        run: >
          maturin build --release --locked --zig --compatibility manylinux2014
          --target "$TARGET" -m crates/tfscan_py/Cargo.toml --out dist
      - name: Build the wheel (macOS)
        if: ${{ !matrix.zig }}
        run: maturin build --release --locked --target "$TARGET" -m crates/tfscan_py/Cargo.toml --out dist
      - name: Package the CLI
        run: |
          name="oxtf-$VERSION-$TARGET"
          mkdir -p "$name"
          cp "target/$TARGET/dist/oxtf" README.md "$name/"
          cp crates/tf_rule_ir/data/checkov/LICENSE.checkov "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
      - name: Smoke test
        if: matrix.smoke
        run: |
          "target/$TARGET/dist/oxtf" --version
          # Exit 1 means findings; 2 or 3 means the scan could not run or complete.
          rc=0; "target/$TARGET/dist/oxtf" scan --no-bundled fixtures/baseline/sibling || rc=$?
          test "$rc" -le 1
          python -m venv smoke
          smoke/bin/pip install dist/*.whl
          smoke/bin/python -c "import tfscan; print(tfscan.__version__, tfscan.CHECKOV_VERSION)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install "maturin==$MATURIN_VERSION"
      - run: maturin sdist -m crates/tfscan_py/Cargo.toml --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build, sdist]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag
          --repo "$GITHUB_REPOSITORY" --title "oxtf $GITHUB_REF_NAME" --generate-notes
